# A cada 2 h: baixa o registro do TSE, coleta pesquisas novas e manchetes, gera site/polls.json,
# salva os dados no repositório e publica site/ no GitHub Pages (polls.json não é versionado).
# Também publica a cada push no main (edições à mão no polls.csv), sem coletar.
# Requer o segredo ANTHROPIC_API_KEY e, em Settings > Pages, a origem "GitHub Actions".
name: Atualizar e publicar

on:
  schedule:
    - cron: "0 */2 * * *"  # UTC; o GitHub pode atrasar alguns minutos
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - run: python -m unittest discover -s tests
      # O tse.csv não é versionado: guarda o último download bom para usar quando o TSE não responder.
      - name: Restaurar último arquivo do TSE
        uses: actions/cache/restore@v4
        with:
          path: data/tse.csv
          key: tse-${{ github.run_id }}
          restore-keys: tse-
      - name: Registro das pesquisas no TSE (dados abertos)
        id: tse
        run: |
          if python tse.py; then echo "novo=1" >> "$GITHUB_OUTPUT"
          else echo "::warning::TSE indisponível; usando o último arquivo guardado, se houver."; fi
      - name: Guardar arquivo do TSE
        if: steps.tse.outputs.novo == '1'
        uses: actions/cache/save@v4
        with:
          path: data/tse.csv
          key: tse-${{ github.run_id }}
      - name: Coletar pesquisas novas
        if: github.event_name != 'push'
        continue-on-error: true  # sem chave ou com a API fora, ainda publica manchetes e apuração
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODELS: claude-sonnet-5-5,claude-haiku-5-5
        run: python collect.py
      - name: Manchetes da Agência Brasil
        if: github.event_name != 'push'
        run: python news.py || echo "Feed indisponível; mantém o news.json anterior."
      - name: Gerar polls.json
        # Código 2 = alguma linha do polls.csv é inválida; o JSON sai com as válidas e o site é publicado mesmo assim.
        run: |
          set +e
          if [ -f data/tse.csv ]; then python ingest.py --tse data/tse.csv; else python ingest.py; fi
          code=$?
          if [ "$code" -eq 2 ]; then echo "::warning::Linhas inválidas no data/polls.csv foram ignoradas; veja o log acima."; exit 0; fi
          exit "$code"
      - name: Salvar dados no repositório
        if: github.event_name != 'push'
        run: |
          git add -A data site
          if git diff --cached --quiet -- data site/news.json; then echo "Nada novo nas fontes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualização automática das pesquisas"
          git pull --rebase
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
